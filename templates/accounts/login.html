{% extends "base.html" %} {% block title %}Connexion — EasyCV{% endblock %} {% block content %}
<div class="row justify-content-center" style="min-height: 60vh; align-items: center;">
    <div class="col-md-5">
        <div class="card-elyon p-4">
            <span class="card-label">Accès</span>
            <h3 class="mb-4">Connexion</h3>
            <form method="post" novalidate>
                {% csrf_token %} {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label> {{ field }} {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>{% endfor %}
                </div>
                {% endfor %}
                <button class="btn btn-elyon-primary w-100" type="submit">Se connecter</button>
            </form>
            <p class="mt-3 text-center small">Pas encore de compte ? <a href="{% url 'accounts:register' %}">Inscris-toi</a></p>
        </div>
    </div>
</div>
{% endblock %}
